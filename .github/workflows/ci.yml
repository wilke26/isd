name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Verhindert parallele Runs auf demselben Branch/PR (spart CI-Minuten)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Werte für den im Compose-File konfigurierten MySQL-Service
  DB_DATABASE: it_service_desk_test
  DB_USERNAME: isd_user
  DB_PASSWORD: secret
  DB_ROOT_PASSWORD: rootsecret

jobs:
  # ---------------------------------------------------------------
  # Job 1: Produktions-Image bauen — fängt kaputte Dockerfile-Änderungen
  # frühzeitig ab, unabhängig vom Testlauf.
  # ---------------------------------------------------------------
  build-production-image:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: it-service-desk/app:prod-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Job 2: Tests gegen den echten Stack (FrankenPHP-Container + MySQL
  # + Redis), über dieselbe docker-compose.yml wie lokal.
  # ---------------------------------------------------------------
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: build-production-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for application
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=mysql"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "REDIS_HOST=redis"
            echo "CACHE_STORE=redis"
            echo "QUEUE_CONNECTION=redis"
            echo "SESSION_DRIVER=redis"
          } >> .env

      - name: Create .env for Docker Compose
        run: |
          cp .env.docker.example .env.docker
          echo "UID=1000" >> .env.docker
          echo "GID=1000" >> .env.docker
          echo "DB_DATABASE=${DB_DATABASE}" >> .env.docker
          echo "DB_USERNAME=${DB_USERNAME}" >> .env.docker
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env.docker
          echo "DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}" >> .env.docker

      - name: Ensure storage/bootstrap-cache are writable by the container's appuser
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          sudo chown -R 1000:1000 storage bootstrap/cache

      - name: Build dev image (with dev dependencies)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          push: false
          load: true
          tags: it-service-desk/app:dev-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml up -d mysql redis

      - name: Wait for MySQL to be healthy
        run: |
          timeout 60s bash -c \
            'until docker inspect --format="{{.State.Health.Status}}" isd-mysql | grep -q healthy; do sleep 2; done'

      - name: Install Composer dependencies
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm app composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm app php artisan key:generate

      - name: Run database migrations
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm app php artisan migrate --force

      - name: Run PHPUnit with coverage
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm -e XDEBUG_MODE=coverage app \
            php artisan test --coverage-clover=coverage.xml --log-junit=junit.xml

      - name: Copy test results out of the volume
        if: always()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm app sh -c "cat coverage.xml" > coverage.xml || true
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm app sh -c "cat junit.xml" > junit.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ---------------------------------------------------------------
  # Job 3: Statische Analyse, Codestyle und bekannte Sicherheitslücken
  # in Abhängigkeiten (separat, damit ein Style-Fehler nicht den
  # teureren Testlauf blockiert/verzögert)
  # ---------------------------------------------------------------
  static-analysis:
    name: Static Analysis & Security (Pint / PHPStan / Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint (Codestyle, nur prüfen)
        run: vendor/bin/pint --test

      # PHPStan/Larastan liest über @mixin-Tags aus _ide_helper_models.php die
      # echten, aus casts()/Relationen abgeleiteten Property-Typen (siehe
      # phpstan.neon: scanFiles). Diese Datei ist bewusst gitignored und muss
      # daher in CI frisch generiert werden — dafür braucht es eine echte,
      # migrierte Datenbank zum Introspizieren. Eine einfache SQLite-Datei
      # reicht dafür aus, es werden keine Testdaten benötigt.
      - name: Prepare minimal environment for Ide-Helper
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations (nur zur Introspektion für Ide-Helper)
        run: php artisan migrate --force

      - name: Generate Ide-Helper model docblocks
        run: php artisan ide-helper:models --write-mixin --no-interaction

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run Composer Audit (bekannte Sicherheitslücken in Abhängigkeiten)
        run: composer audit --locked

  # ---------------------------------------------------------------
  # Job 4: Fresh-Checkout-Smoke-Test — spielt die in README.md
  # dokumentierten Schnellstart-Schritte wortwörtlich gegen einen
  # frischen Checkout durch (nicht die CI-eigene Env-Logik aus Job 2!).
  # Soll genau die Klasse von Dokumentationsfehlern automatisch fangen,
  # die zuvor manuell entdeckt werden mussten (kommentierte .env-Zeilen,
  # fehlende .env-Anpassung im Schnellstart, Volume-Berechtigungen).
  # ---------------------------------------------------------------
  fresh-checkout-smoke-test:
    name: Fresh Checkout Smoke Test (README Quickstart)
    runs-on: ubuntu-latest
    needs: build-production-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exakt die in README.md → Schnellstart dokumentierten Schritte,
      # nicht die bespoke Env-Logik aus dem "test"-Job oben — sonst würde
      # eine Abweichung zwischen Doku und CI-Skript nie auffallen.
      - name: Create .env exactly as documented in README quickstart
        run: |
          cp .env.example .env

          set_env_var() {
            local key="$1" value="$2"
            if grep -qE "^#?[[:space:]]*${key}=" .env; then
              sed -i -E "s/^#?[[:space:]]*${key}=.*/${key}=${value}/" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }
          set_env_var DB_CONNECTION mysql
          set_env_var DB_HOST mysql
          set_env_var DB_PORT 3306
          set_env_var DB_DATABASE it_service_desk
          set_env_var DB_USERNAME isd_user
          set_env_var DB_PASSWORD secret
          set_env_var REDIS_HOST redis
          set_env_var CACHE_STORE redis
          set_env_var QUEUE_CONNECTION redis
          set_env_var SESSION_DRIVER redis
          set_env_var MAIL_HOST mailpit
          set_env_var MAIL_PORT 1025

      - name: Create .env.docker
        run: |
          cp .env.docker.example .env.docker
          echo "UID=1000" >> .env.docker
          echo "GID=1000" >> .env.docker

      # storage/ und bootstrap/cache liegen im Bind-Mount, nicht in einem
      # benannten Volume — sie übernehmen daher immer exakt die Rechte, die
      # der GitHub-Actions-Checkout ihnen gibt, unabhängig vom Image. Lokal
      # fällt das nie auf (Host-User == appuser-UID), in CI schon.
      - name: Ensure storage/bootstrap-cache are writable by the container's appuser
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          sudo chown -R 1000:1000 storage bootstrap/cache

      # --no-cache: verhindert, dass ein zwischengespeicherter Layer eine
      # kaputte Dockerfile-Änderung (z.B. Volume-Berechtigungen) verdeckt.
      - name: Build image from scratch (no layer cache)
        run: docker compose --env-file .env.docker build --no-cache

      - name: Start the full stack
        run: docker compose --env-file .env.docker up -d

      - name: Wait for MySQL to be healthy
        run: |
          timeout 60s bash -c \
            'until docker inspect --format="{{.State.Health.Status}}" isd-mysql | grep -q healthy; do sleep 2; done'

      # Bewusst OHNE manuellen chown-Zwischenschritt für die benannten
      # Volumes (vendor-data, caddy-data, ...) — genau das soll dieser Test
      # verifizieren: dass sie ohne Nacharbeit funktionieren (siehe
      # Dockerfile: Verzeichnisse werden vor USER appuser mit passenden
      # Rechten angelegt).
      - name: Install Composer dependencies
        run: docker compose --env-file .env.docker exec -T app composer install --no-interaction

      - name: Generate application key
        run: docker compose --env-file .env.docker exec -T app php artisan key:generate

      - name: Run migrations and seed
        run: docker compose --env-file .env.docker exec -T app php artisan migrate --seed --force

      # Über den Klartext-HTTP-Fallback auf Port 80 (siehe Caddyfile) statt
      # HTTPS — spart mkcert/Zertifikats-Vertrauen in der CI-Umgebung, ist
      # aber derselbe Endpunkt, den auch Prometheus zum Scrapen nutzt.
      - name: Verify the application actually responds
        run: |
          curl -fsS http://localhost/up
          curl -fsS http://localhost/metrics | grep -q isd_tickets_by_status

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.docker logs

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.docker down -v
