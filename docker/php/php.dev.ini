; Entwicklungs-Einstellungen
display_errors = On
error_reporting = E_ALL
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Xdebug ist installiert, aber standardmäßig per ENV (XDEBUG_MODE=off) deaktiviert,
; um die Performance im Normalbetrieb nicht zu beeinträchtigen.
; Aktivieren: docker compose run -e XDEBUG_MODE=debug app ...
; oder dauerhaft in .env: XDEBUG_MODE=debug
xdebug.start_with_request = yes
xdebug.discover_client_host = false
xdebug.idekey = PHPSTORM
